function home(){if(!browserSignedIn())return loginPage();app.innerHTML=`<div class="row"><button class="tag" onclick="go('account')">花与爪 · 我的账号 ↗</button><button class="small" onclick="openLibrary('',true)">♡ 我的收藏</button></div><div class="home-hero"><h2>爱花，也爱它。<br><span>让每一份好奇都安心</span></h2><p>给爱花的铲屎官，一本有依据的植物手册。</p></div><form id="home-search" class="search"><button type="submit" aria-label="搜索植物" style="font-size:21px;padding:0 2px">⌕</button><input id="home-query" placeholder="搜索植物名称、别名或学名" value="${esc(q)}" enterkeyhint="search"></form><div class="banner" role="button" tabindex="0" onclick="go('identify')"><div><strong>不认识这株植物？</strong><p>拍一张，先认识，再靠近 →</p></div><span class="flower">❀</span></div><section class="common-plants"><div class="common-heading"><strong>从常见植物开始</strong><span>认识身边的花草</span></div><div class="common-grid">${[['百合','先辨清种类','❀'],['郁金香','常见鲜花','♧'],['绿萝','常见盆栽','❧']].map(([name,hint,symbol])=>`<button class="common-plant" onclick="openLibrary('${name}')"><span class="common-symbol">${symbol}</span><strong>${name}</strong><small>${hint} ↗</small></button>`).join('')}</div><div class="common-note">按名称查询，先核对身份，再了解猫狗风险。</div></section><button class="home-journal" onclick="shop('flower-checklist')"><small>BEFORE YOU BRING IT HOME</small><strong>买花之前，<br>留一分钟给它。</strong><span>养宠家庭的买花小清单 ↗</span><img src="assets/brand/garden-line.svg" alt=""></button><div class="home-endnote">让喜欢的花，也成为安心的日常。</div>`;document.querySelector('#home-search').onsubmit=e=>{e.preventDefault();openLibrary(document.querySelector('#home-query').value,false)};renderTabs('home')}
function openLibrary(query='',onlySaved=false){q=query;saved=onlySaved;risk='all';library();window.scrollTo(0,0)}

let libraryOrder='common',libraryNoticeOpen=false;
function library(){if(!browserSignedIn())return loginPage();app.innerHTML=`<div class="library-header"><div><div class="tag">PLANT LIBRARY</div><h2>植物图鉴</h2><div class="library-subtitle">${plants.length} 份分类档案 · 鲜花与盆栽</div></div><button class="small" onclick="saved=!saved;library()">${saved?'查看全部':'♡ 收藏'}</button></div><div class="search"><span>⌕</span><input id="query" placeholder="搜索中文名、学名或常用名" value="${esc(q)}"></div><div class="quick-search"><span>常查</span>${['苏铁','郁金香','杜鹃','百合'].map(x=>`<button onclick="q='${x}';library()">${x}</button>`).join('')}</div><button class="library-feature" onclick="openLibrary('百合')"><div><small>辨名小课堂 / 01</small><strong>百合，不止一种。</strong><span>从名字开始，分清相似的花草</span></div><b>❀ ↗</b></button><div class="library-filters"><div class="pet-switch">${[['cat','猫咪'],['dog','狗狗']].map(([x,n])=>`<button class="${pet===x?'selected':''}" onclick="pet='${x}';library()">${n}</button>`).join('')}</div><select aria-label="风险筛选" id="catalog-risk">${[['all','全部风险'],['toxic','有毒'],['low','资料列为无毒'],['caution','谨慎接触'],['unknown','证据不足']].map(([x,n])=>`<option value="${x}" ${risk===x?'selected':''}>${n}</option>`).join('')}</select></div><div class="library-notice"><button class="notice-heading" aria-expanded="${libraryNoticeOpen}" onclick="libraryNoticeOpen=!libraryNoticeOpen;library()"><span>使用须知 · 无毒不等于可食用</span><span>${libraryNoticeOpen?'收起 −':'展开 ＋'}</span></button>${libraryNoticeOpen?libraryNotice.paragraphs.map(p=>`<p>${p}</p>`).join('')+`<p>${libraryNotice.attribution}</p><a href="${libraryNotice.source}" target="_blank" rel="noopener">查看 ASPCA 参考说明 ↗</a>`:''}<button class="emergency-link" onclick="document.querySelector('dialog').showModal()">疑似误食或出现不适？及时联系兽医 ↗</button></div><div class="library-toolbar"><div class="sort-switch"><button class="${libraryOrder==='common'?'selected':''}" onclick="libraryOrder='common';library()">按常用名</button><button class="${libraryOrder==='scientific'?'selected':''}" onclick="libraryOrder='scientific';library()">按学名</button></div><span id="result-count"></span></div><div id="results"></div><div class="catalog-footnote">${plants.length} 个分类档案 · 含属级总览、物种及园艺类群<br>来源与证据适用范围见详情，资料仍待专业复核。</div>`;document.querySelector('#query').oninput=e=>{q=e.target.value;results()};document.querySelector('#catalog-risk').onchange=e=>{risk=e.target.value;results()};results();renderTabs('library')}
function results(){const ambiguity=Huamao.getAmbiguity(q),items=Huamao.search(q,pet,risk,saved?favorites:null,libraryOrder);document.querySelector('#result-count').textContent=(saved?'收藏 · ':'')+items.length+' 个结果';document.querySelector('#results').innerHTML=(ambiguity?`<div class="notice"><strong>${ambiguity.title}</strong><div>${ambiguity.message}</div></div>`:'')+items.map(p=>`<article class="catalog-item catalog-risk-${p.risk}" role="button" tabindex="0" onclick="detail('${p.id}')" onkeydown="if(event.key==='Enter')detail('${p.id}')"><div class="catalog-item-top"><strong>${p.name}</strong><span class="badge ${p.risk}">${p.label}</span></div><div class="catalog-latin">${p.latin}</div><div class="catalog-taxonomy">${p.family} · ${p.genus} 属</div>${p.aliasSummary?`<div class="catalog-alias">常用名：${p.aliasSummary}</div>`:''}</article>`).join('')+(!items.length?'<div class="empty"><strong>没有匹配的植物</strong><p>换个名字或调整筛选试试。未收录不代表安全。</p></div>':'')}

function detail(id){if(!browserSignedIn())return loginPage();renderTabs(null);const p=plants.find(p=>p.id===id);app.innerHTML=`<div class="tag">PLANT JOURNAL / 植物档案</div><div class="row"><div><h2>${p.name}</h2></div><div class="icon">${p.icon}</div></div><div class="section">植物介绍</div><div class="plant-introduction"><div class="body plant-overview">${p.feature}</div><dl class="plant-facts"><div><dt>学名</dt><dd class="scientific-name">${p.latin}</dd></div><div><dt>科</dt><dd>${p.family}</dd></div><div><dt>属</dt><dd>${p.genus}</dd></div><div><dt>其他常用名</dt><dd>${esc(p.commonNamesText)}</dd></div>${p.scientificSynonymsText?`<div><dt>旧学名 / 异名</dt><dd>${esc(p.scientificSynonymsText)}</dd></div>`:''}<div><dt>档案层级</dt><dd>${p.rank}</dd></div></dl><dl class="plant-care"><div><dt>光照</dt><dd>${p.light}</dd></div><div><dt>浇水</dt><dd>${p.water}</dd></div><div><dt>环境</dt><dd>${p.temp}</dd></div></dl><p class="muted">养护资料：${p.careStatus}</p></div><button class="btn" id="favorite">${favorites.includes(id)?'♥ 已收藏 · 点击取消':'♡ 收藏这株植物'}</button><div class="notice">${p.rank} · 证据范围：${p.evidenceScope}<div>${p.reviewStatus}</div></div><div class="section">先了解，对它的影响</div>${[['cat','猫咪'],['dog','狗狗']].map(([k,n])=>`<div class="card"><div class="row"><strong>${n}</strong><span class="badge ${p[k]}">${labels[p[k]]}</span></div><div class="body">${p[k+'Harm']}</div></div>`).join('')}<div class="section">如何安心相处</div><div class="body">${p.avoid}</div><div class="notice">疑似误食应立即咨询兽医；不要自行催吐、喂药或强行喂水。高危暴露不要等待症状出现。</div><div class="card"><strong>多了解一株，陪伴更安心。</strong><p>读完介绍与猫狗风险后，把这份了解记下来。</p><button class="btn" id="learn-plant" ${Growth.normalize(growthRecords()).learned.includes(id)?'disabled':''}>${Growth.normalize(growthRecords()).learned.includes(id)?'已记入成长册 ✓':'已了解 · 记入成长册'}</button><p id="learn-feedback" role="status"></p></div><div id="experiences"></div><div class="section">证据究竟支持到哪一级？</div><div class="card body">证据对象：${p.evidenceTaxon}<br>适用范围：${p.evidenceScope}<br>核对日期：${p.reviewedAt}<p>${p.reviewStatus}</p></div>${p.identityNote!==p.feature?`<div class="notice">${p.identityNote}</div>`:''}<p>花色、花型和商品名不能单独证明毒性或安全。风险标签并非临床分级。</p>${p.sources.map(s=>`<div class="card"><strong style="font-size:13px">${s.title}</strong><p>依据对象：${esc(s.taxon)}<br>${s.kind==='toxicity'?'毒性依据':s.kind==='care'?'养护参考':'分类与特征依据'} · ${s.accessed}</p><a href="${s.url}" target="_blank" rel="noopener" style="font-size:12px;color:#466d54">查看原始资料 ↗</a></div>`).join('')}${p.related.length?'<div class="section">相近名称，分别核对</div>':''}${p.related.map(id=>plants.find(x=>x.id===id)).filter(Boolean).map(x=>`<button class="card" style="width:100%;text-align:left" onclick="detail('${x.id}')"><div class="name">${x.name} ↗</div><div class="latin">${x.latin} · ${x.rank}</div></button>`).join('')}<p>“无毒”不代表可食用；没有物种或品种独立证据时，不虚构专属毒性剂量和严重程度。</p>`;document.querySelector('#favorite').onclick=()=>{favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem(browserKey('favorites'),JSON.stringify(favorites));detail(id)};document.querySelector('#learn-plant').onclick=()=>{try{localStorage.setItem(browserKey('growth'),JSON.stringify(Growth.learn(growthRecords(),id,plants.map(p=>p.id))));const b=document.querySelector('#learn-plant');b.disabled=true;b.textContent='已记入成长册 ✓';document.querySelector('#learn-feedback').textContent='可前往我的 → 花与爪成长册查看进度'}catch(_){document.querySelector('#learn-feedback').textContent='保存失败，请重试'}};renderExperiences(id);window.scrollTo(0,0)}
function identify(){if(!browserSignedIn())return loginPage();renderTabs(null);app.innerHTML=`<div class="tag">A LITTLE CURIOSITY / 拍照识植物</div><h2>认识眼前的绿意</h2><p>拍清叶片、花朵和整株，尽量只包含一种植物。</p><label class="upload" for="photo" id="photo-preview"><div><div class="flower" style="color:#738967">❀</div><p>拍照或从相册选择<br>一张照片，开始了解</p></div></label><input id="photo" type="file" accept="image/jpeg,image/png" hidden><div class="photo-actions"><button class="btn" id="photo-camera">拍照识植物</button><button class="btn" id="photo-album">从相册选择</button></div><p>拍摄或选图后仅在本机预览，不会自动上传。浏览器由设备决定是否支持直接拍照，微信版使用原生相机入口。</p><button class="btn primary" onclick="document.querySelector('#service').hidden=false">确认照片，开始识别</button><div class="notice" id="service" hidden>这是页面设计预览。真实识别请在微信小程序配置云环境与百度密钥后使用；此处不会生成模拟识别结果。</div><div class="notice">识别候选可能出错，相似外观无法确认毒性。分数不是安全概率。请核对物种；未收录或名称不明确时，应视为风险未知。</div>`;document.querySelector('#photo-camera').onclick=()=>{if(!confirm('确认后将打开设备支持的拍照或选图界面。照片先在本机预览，不会自动上传。是否继续？'))return;const input=document.querySelector('#photo');input.setAttribute('capture','environment');input.click()};document.querySelector('#photo-album').onclick=()=>{const input=document.querySelector('#photo');input.removeAttribute('capture');input.click()};document.querySelector('#photo').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader;reader.onload=()=>{document.querySelector('#photo-preview').innerHTML=`<img alt="已选择的植物照片" src="${reader.result}">`};reader.readAsDataURL(file)}}
let experienceFilter='全部';
function experienceRecords(){try{const records=JSON.parse(localStorage.getItem(browserKey('experiences'))||'[]');return Array.isArray(records)?records:[]}catch(_){return []}}
function renderExperiences(id){const el=document.querySelector('#experiences');if(!el)return;const records=Experiences.list(experienceRecords(),id,experienceFilter);el.innerHTML=`<div class="section">铲屎官经验</div><p>交流养护与防护小妙招，也记录真实接触经历。经验不能替代毒性依据。</p><div class="notice">本地体验版：仅保存在当前浏览器，不会公开给其他用户。社区共享需接入账号、云端存储与内容审核。</div><button class="btn primary" id="write-experience">＋ 写下我的经验</button><form id="experience-form" class="card" hidden><label class="small" for="nickname">昵称（可不填）</label><input id="nickname" maxlength="20" placeholder="一位铲屎官" value="${esc(browserProfile()?.nickname||'')}" style="background:#f2f3ed;padding:12px;border-radius:10px;margin:10px 0"><div class="row"><select id="experience-category" aria-label="经验分类">${Experiences.categories.map(x=>`<option>${x}</option>`).join('')}</select><select id="experience-pet" aria-label="宠物类型">${Experiences.pets.map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="experience-content" aria-label="实际体验" placeholder="请写清环境、做法与观察，至少10字，勿填写联系方式。" maxlength="1000" style="width:100%;height:150px;resize:vertical;border:0;background:#f2f3ed;padding:12px;border-radius:10px;margin-top:15px;font:inherit;font-size:13px;line-height:1.8"></textarea><div class="notice">“我家吃了没事”不能证明无毒。请勿推荐试吃、自行催吐或用药；疑似误食应联系兽医。</div><p id="experience-error" role="alert"></p><button type="submit" class="btn primary">保存我的经验（仅本机）</button></form><div class="chips">${['全部',...Experiences.categories].map(x=>`<button class="chip ${experienceFilter===x?'active':''}" data-review-filter="${x}">${x}</button>`).join('')}</div>${records.length?records.map(x=>`<div class="card"><div class="row"><strong>${esc(x.nickname)}</strong><span class="badge low">${esc(x.category)}</span></div><div class="badge low">${esc(x.identityTitle||'未设置养宠身份')}</div><p>${esc(x.pet)} · ${esc(x.date)} · 仅本机</p><div class="body" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.content)}</div><p>个人经验 · 未经核实 · 不作为安全结论</p><button class="btn" data-review-delete="${esc(x.id)}">删除我的记录</button></div>`).join(''):'<div class="card"><p>这里还没有记录。写下你的第一条实际体验吧。</p></div>'}`;
el.querySelector('#write-experience').onclick=()=>{const form=el.querySelector('form');form.hidden=!form.hidden};
el.querySelector('form').onsubmit=e=>{e.preventDefault();try{const record=Experiences.create({identityType:browserProfile()?.identityType,nickname:el.querySelector('#nickname').value,content:el.querySelector('#experience-content').value,category:el.querySelector('#experience-category').value,pet:el.querySelector('#experience-pet').value},id);localStorage.setItem(browserKey('experiences'),JSON.stringify([record,...experienceRecords()]));experienceFilter='全部';renderExperiences(id)}catch(e){el.querySelector('#experience-error').textContent=e.message||'保存失败，请重试'}};
el.querySelectorAll('[data-review-filter]').forEach(b=>b.onclick=()=>{experienceFilter=b.dataset.reviewFilter;renderExperiences(id)});
el.querySelectorAll('[data-review-delete]').forEach(b=>b.onclick=()=>{if(confirm('删除这条本机经验？删除后无法恢复。')){try{localStorage.setItem(browserKey('experiences'),JSON.stringify(experienceRecords().filter(x=>x.id!==b.dataset.reviewDelete)));renderExperiences(id)}catch(_){alert('删除失败，请重试')}}});
}

function browserProfile(){try{return JSON.parse(localStorage.getItem('huamao-demo-profile')||'null')}catch(_){return null}}
function browserSignedIn(){return !!(localStorage.getItem('huamao-demo-signed-in')&&identities.some(x=>x.value===browserProfile()?.identityType))}
function browserKey(kind){return 'huamao-'+kind+'-'+(browserProfile()?.id||'signed-out')}
function loginPage(){if(localStorage.getItem('huamao-demo-signed-in')&&browserProfile())return identityOnboarding();renderTabs(null);app.innerHTML=`<div class="tag">PAWLEAF · 花与爪</div><div class="flower" style="font-size:100px;color:#74916b;margin:45px 0 25px">❀</div><h2>把花和它，<br>一起放在心上。</h2><p>登录花与爪，建立属于你的植物与养宠记录。</p><div class="card body">一个微信身份，对应一个花与爪账号。<br>首次登录自动注册，无需设置密码。<br>头像、昵称由你填写，手机号可稍后授权绑定。</div><div class="notice">本地体验模式：尚未接入微信账号服务。只会创建本机体验账号，不会获取微信身份或手机号。</div><label style="display:flex;align-items:center;gap:8px;font-size:12px;margin:25px 0 10px"><input type="checkbox" id="account-consent" style="width:auto">我已阅读下方账号与隐私说明</label><details><summary style="font-size:12px;cursor:pointer">查看账号与隐私说明 · 草案</summary><p>本机体验资料只保存在当前浏览器。正式微信版本拟使用云端身份标识区分账号，头像昵称由你主动提交，手机号额外授权后绑定，不公开。当前经验记录仍仅保存在本机。正式开放注册前，需补充运营主体、联系方式、保存期限及注销删除渠道；云端注册默认关闭。</p></details><button class="btn primary" id="demo-login">创建 / 登录本机体验账号</button><p id="account-error" role="alert"></p>`;document.querySelector('#demo-login').onclick=()=>{if(!document.querySelector('#account-consent').checked){document.querySelector('#account-error').textContent='请先阅读并同意账号与隐私说明';return}try{const profile=browserProfile()||{id:'demo-'+Date.now().toString(36),nickname:'花与爪铲屎官',avatar:'',mode:'demo'};localStorage.setItem('huamao-demo-profile',JSON.stringify(profile));localStorage.setItem('huamao-demo-signed-in','true');favorites=JSON.parse(localStorage.getItem(browserKey('favorites'))||'[]');if(identities.some(x=>x.value===profile.identityType))home();else identityOnboarding();window.scrollTo(0,0)}catch(_){document.querySelector('#account-error').textContent='浏览器无法保存本机资料，请检查存储设置'}};window.scrollTo(0,0)}
function growthRecords(){try{return JSON.parse(localStorage.getItem(browserKey('growth'))||'{}')||{}}catch(_){return {}}}
function growthPage(){if(!browserSignedIn())return loginPage();renderTabs(null);const g=Growth.summary(growthRecords(),experienceRecords(),plants.map(p=>p.id));app.innerHTML=`<button class="small" onclick="accountPage()">‹ 返回我的花与爪</button><div class="tag" style="margin-top:24px">GROW WITH PAWLEAF / 花与爪成长册</div><h2>每一份了解，<br>都值得被记住。</h2><p>认识花草，记录生活，慢慢成为更细心的陪伴者。</p><div class="card"><div class="row"><div><strong>今日的小小约定</strong><p>累计 ${g.dayCount} 天 · 连续 ${g.streak} 天</p></div><button class="btn primary" id="growth-checkin" ${g.checked?'disabled':''}>${g.checked?'今日已打卡 ✓':'今日打卡'}</button></div><p>每天记一次，漏签不清空累计进度。</p><p id="growth-feedback" role="status"></p></div><div class="growth-stats">${[[g.learnedCount,'认识的档案'],[g.experienceCount,'记录的植物'],[g.unlocked,'已获徽章']].map(([n,t])=>`<div><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><div class="card"><strong>${g.next?'下一枚：'+g.next.title:'本阶段探索已完成'}</strong><p>${g.next?g.next.requirement+' · '+g.next.current+' / '+g.next.target:'继续记录花与它的日常吧。'}</p>${g.next?`<div class="growth-progress"><span style="width:${g.next.percent}%"></span></div>`:''}<button class="small" onclick="openLibrary()">去认识一株植物 →</button></div><div class="section">我的徽章墙</div><div class="growth-grid">${g.badges.map(b=>`<div class="growth-badge ${b.unlocked?'earned':''}"><div class="badge-flower">❀</div><strong>${b.title}</strong><p>${b.requirement}</p><span>${b.unlocked?'已解锁 ✓':b.current+' / '+b.target}</span></div>`).join('')}</div><details class="account-info"><summary>成长如何积累</summary><p>认识植物：阅读详情后主动点击“记入成长册”，同一档案只计一次。属级总览和具体物种分别是档案，不等同于物种数。</p><p>记录经验：在不同植物下保存至少 10 字的实际体验，每份植物档案只计一次；删除全部对应经验后进度会重新计算。</p><p>徽章记录参与进度，不代表专业资质，也不能作为植物安全依据。</p></details><div class="card"><strong>互助问答 · 暂不计成长</strong><p>已可在“花友互助”本地体验发帖与回复。公共问答与审核接通后，再按有效帮助积累成长；目前回复暂不计分。</p></div><div class="notice">成长记录按账号保存在本机，暂不跨设备同步。清理浏览器数据可能丢失；本地时间仅用于体验，上线后需由服务端校验。</div>`;document.querySelector('#growth-checkin').onclick=()=>{try{localStorage.setItem(browserKey('growth'),JSON.stringify(Growth.checkIn(growthRecords())));growthPage();document.querySelector('#growth-feedback').textContent='今日打卡成功'}catch(_){document.querySelector('#growth-feedback').textContent='保存失败，请重试'}};window.scrollTo(0,0)}
function identityOnboarding(){renderTabs(null);const profile=browserProfile();if(!profile||!localStorage.getItem('huamao-demo-signed-in'))return loginPage();app.innerHTML=`<div class="tag">PAWLEAF · 花与爪</div><p style="margin-top:28px">最后一步 · 认识一下你</p><h2>你和谁，<br>一起迎接花开？</h2><p>选择养宠身份，领取你的专属称号。</p><form id="onboarding-form"><div style="margin:24px 0">${identities.map(x=>`<label class="identity-choice"><input type="radio" name="onboardingIdentity" value="${x.value}" ${profile.identityType===x.value?'checked':''}><span class="identity-visual"><img src="assets/identities/${x.value}.svg" alt="${x.label}"><span class="identity-copy"><strong>${x.title}</strong><small>${x.label}</small></span><span class="identity-tick" aria-hidden="true"></span></span></label>`).join('')}</div><p>这是你自选的生活身份，之后可在“我的”随时修改。</p><p id="onboarding-error" role="alert"></p><button type="submit" class="btn primary">选好了，进入花与爪 →</button></form><div class="login-garden"><img src="assets/brand/garden-line.svg" alt=""><img class="garden-butterfly" src="assets/brand/butterfly-line.svg" alt=""></div>`;document.querySelector('#onboarding-form').onsubmit=e=>{e.preventDefault();const identityType=document.querySelector('input[name=onboardingIdentity]:checked')?.value;if(!identities.some(x=>x.value===identityType)){document.querySelector('#onboarding-error').textContent='请先选择你的养宠身份';return}try{localStorage.setItem('huamao-demo-profile',JSON.stringify({...profile,identityType}));favorites=JSON.parse(localStorage.getItem(browserKey('favorites'))||'[]');home();window.scrollTo(0,0)}catch(_){document.querySelector('#onboarding-error').textContent='身份保存失败，请重试'}};window.scrollTo(0,0)}
function accountPage(panel=''){if(!browserSignedIn())return loginPage();renderTabs('account');const profile=browserProfile(),identity=identities.find(x=>x.value===profile.identityType);const records=experienceRecords().slice().sort((a,b)=>b.createdAt-a.createdAt);const count=favorites.filter(id=>plants.some(p=>p.id===id)).length;app.innerHTML=`<div class="tag">MY PAWLEAF / 我的花与爪</div><div class="account-hero"><div class="account-avatar">${profile.avatar?`<img src="${esc(profile.avatar)}" alt="我的头像">`:identity?`<img src="assets/identities/${identity.value}.svg" alt="养宠身份">`:'❀'}</div><h2>${esc(profile.nickname)}</h2><span class="account-title">${identity?identity.title:'领取你的养宠称号'}</span><p>和花草、毛孩子，一起好好生活。</p><button class="small" onclick="accountEditor()">编辑资料与身份 ↗</button></div><div class="account-stats"><button onclick="openLibrary('',true)"><strong>${count}</strong><span>植物收藏</span></button><button onclick="accountPage('experiences')"><strong>${records.length}</strong><span>我的经验</span></button></div><button class="growth-entry" onclick="growthPage()"><strong>❀　花与爪成长册</strong><span>每日打卡 · 认识植物 · 解锁徽章 →</span></button><div class="section">我的记录</div><div class="account-menu"><button onclick="openLibrary('',true)"><span>♡　我的植物收藏</span><span>查看收藏 →</span></button><button onclick="accountPage('experiences')"><span>✎　我的养宠经验</span><span>仅本机 →</span></button><button onclick="accountEditor()"><span>◎　账号与个人资料</span><span>修改 →</span></button></div>${panel==='experiences'?`<div class="section">我的养宠经验</div><p>记录养护与防护的实际体验，仅在本机保存。</p>${records.length?records.map(r=>{const p=plants.find(p=>p.id===r.plantId);return `<div class="card"><div class="row"><strong>${esc(p?.name||'植物档案暂不可用')}</strong><span class="badge low">${esc(r.category)}</span></div><p>${esc(r.date)} · ${esc(r.pet)}</p><div class="body account-record">${esc(r.content)}</div>${p?`<button class="small" onclick="detail('${p.id}')">查看植物与管理经验 →</button>`:''}</div>`}).join(''):'<div class="card"><strong>还没有写下经验</strong><p>在植物详情页记录你的养护心得或防护做法。</p><button class="small" onclick="openLibrary()">去植物图鉴逛逛 →</button></div>'}`:''}<div class="section">关于花与爪</div><details class="account-info"><summary>使用与隐私说明</summary><p>当前为本机体验账号，资料、收藏与经验保存在当前浏览器，不会同步至其他设备。清理浏览器数据可能丢失记录。头像昵称由你主动填写，体验版不获取微信身份或手机号。</p></details><details class="account-info"><summary>资料来源与纠错</summary><p>植物详情附原始资料链接、证据适用范围与复核状态。个人经验不能替代毒性依据。发现问题时，请记录植物学名、问题描述和来源链接；目前尚未开通线上反馈渠道。</p></details><div class="notice">本机体验版 · 微信登录、云端同步与公共社区尚未开放。</div><button class="btn" id="account-signout">退出登录</button>`;document.querySelector('#account-signout').onclick=()=>{localStorage.removeItem('huamao-demo-signed-in');saved=false;q='';loginPage()};window.scrollTo(0,0)}
function accountEditor(){if(!browserSignedIn())return loginPage();const profile=browserProfile();renderTabs('account');app.innerHTML=`<button class="small" onclick="accountPage()">‹ 返回我的花与爪</button><div class="tag">EDIT PROFILE / 编辑资料</div><button class="btn" style="margin-bottom:12px" onclick="openLibrary('',true)">♡ 我的植物收藏 →</button><h2>你好，铲屎官。</h2><span class="badge low" id="identity-title" style="font-size:14px;padding:9px 14px">${esc((identities.find(x=>x.value===profile.identityType)||{}).title||'待选择养宠身份')}</span><div class="notice">本机体验账号 · 不是微信登录。经验按本机账号分别保存，不会同步到其他设备。</div><form id="profile-form" class="card"><label for="account-avatar" class="icon" style="width:80px;height:80px;overflow:hidden;cursor:pointer;border-radius:50%">${profile.avatar?`<img src="${esc(profile.avatar)}" alt="我的头像" style="width:100%;height:100%;object-fit:cover">`:'❀'}</label><input type="file" id="account-avatar" accept="image/jpeg,image/png" hidden><p>点击选择头像（由你主动选择）</p><label for="account-nickname" class="section">我的昵称</label><input id="account-nickname" maxlength="20" value="${esc(profile.nickname)}" style="background:#f2f3ed;padding:12px;border-radius:10px;margin:15px 0"><div class="section">我的养宠身份</div><p>选择你的养宠情况，领取专属称号。随时可以修改。</p><div id="identity-options">${identities.map(x=>`<label class="identity-choice"><input type="radio" name="petIdentity" value="${x.value}" ${profile.identityType===x.value?'checked':''}><span class="identity-visual"><img src="assets/identities/${x.value}.svg" alt="${x.label==='养猫'?'猫猫大脸':x.label==='养狗'?'狗狗大脸':'猫猫和狗狗大脸'}"><span class="identity-copy"><strong>${x.title}</strong><small>${x.label}</small></span><span class="identity-tick" aria-hidden="true"></span></span></label>`).join('')}</div><button class="btn primary" type="submit">保存资料</button><p id="profile-feedback" role="status"></p></form><div class="card"><strong>手机号</strong><p>尚未绑定 · 仅自己可见<br>手机号可不绑定；当前不提供短信登录。</p><button class="btn" id="phone-info">了解手机号授权</button><p id="phone-feedback" role="status"></p></div><p>账号编号：${esc(profile.id)}<br>普通注册账号，暂不包含付费会员服务。</p><button class="btn" id="logout">退出登录</button>`;let avatar=profile.avatar||'';document.querySelector('#account-avatar').onchange=e=>{const file=e.target.files[0];if(!file)return;if(file.size>1024*1024){document.querySelector('#profile-feedback').textContent='请选择1MB以内的头像';return}const reader=new FileReader();reader.onload=()=>{avatar=reader.result;const label=document.querySelector('label[for="account-avatar"]');label.innerHTML=`<img alt="待保存的头像" src="${avatar}" style="width:100%;height:100%;object-fit:cover">`};reader.readAsDataURL(file)};document.querySelector('#profile-form').onsubmit=e=>{e.preventDefault();try{const nickname=document.querySelector('#account-nickname').value.trim()||'花与爪铲屎官';const identityType=document.querySelector('input[name=petIdentity]:checked')?.value||'';localStorage.setItem('huamao-demo-profile',JSON.stringify({...profile,nickname,avatar,identityType}));document.querySelector('#identity-title').textContent=(identities.find(x=>x.value===identityType)||{}).title||'待选择养宠身份';accountPage();return}catch(_){document.querySelector('#profile-feedback').textContent='保存失败，请使用更小的头像重试'}};document.querySelector('#phone-info').onclick=()=>document.querySelector('#phone-feedback').textContent='体验模式不收集真实手机号。正式微信授权需要开通相应能力，并由你点击同意后绑定。';document.querySelector('#logout').onclick=()=>{localStorage.removeItem('huamao-demo-signed-in');saved=false;q='';loginPage()};window.scrollTo(0,0)}

let forumOwner='',forumCategory='全部',forumQuery='',forumDraft={title:'',content:'',category:'养花求助'};
function forumRecords(){try{const r=JSON.parse(localStorage.getItem(browserKey('community'))||'[]');return Array.isArray(r)?r:[]}catch(_){return []}}
let forumGuideId='';
function shop(guideId){if(!browserSignedIn())return loginPage();if(typeof guideId==='string')forumGuideId=guideId;if(forumOwner!==browserProfile().id){forumOwner=browserProfile().id;forumCategory='全部';forumQuery='';forumDraft={title:'',content:'',category:'养花求助'}}renderTabs('shop');const records=Community.list(forumRecords(),forumCategory,forumQuery);app.innerHTML=`<div class="community-refined"><div class="tag">PAWLEAF COMMUNITY / 花友互助</div><div class="community-hero"><div><h2>和花友，聊点生活。</h2><p>花草与毛孩子，都值得被认真对待。</p></div><span>❀</span></div><details class="local-strip"><summary>本机交流空间 · 暂未公开共享</summary><p>帖子和回复仅当前账号在本机可见。云端共享与审核接通后，再开放公共交流。</p></details><div class="guide-heading"><strong>先聊这些小问题</strong><small>花与爪整理 · ${Guides.length} 问</small></div><div class="guide-list">${Guides.map(g=>`<details ${forumGuideId===g.id?'open':''}><summary><small>${g.tag}</small><span>${g.title}</span></summary><p>${esc(g.answer)}</p>${g.action?`<button class="guide-action" data-guide-action="${g.id}">${g.action} ↗</button>`:''}</details>`).join('')}</div><div class="community-feed-heading"><div><strong>花友的日常</strong><small>${records.length} 篇本机帖子</small></div><button class="btn primary" onclick="forumCompose()">＋ 写一篇</button></div><form id="forum-search" class="search"><input aria-label="搜索帖子" placeholder="搜索帖子标题或内容" value="${esc(forumQuery)}"><button type="submit" class="small">搜索</button></form><div class="chips">${['全部',...Community.categories].map(c=>`<button class="chip ${c===forumCategory?'active':''}" data-forum-category="${c}">${c}</button>`).join('')}</div>${records.length?records.map(p=>`<button class="card forum-post" data-forum-id="${esc(p.id)}"><span class="badge low">${p.category}</span><strong>${esc(p.title)}</strong><div class="post-excerpt">${esc(p.content)}</div><p>${esc(p.nickname)} · ${p.date} · ${p.replies.length} 条回复</p></button>`).join(''):`<div class="community-empty"><span>♧</span><div><strong>${forumQuery?'暂时没有找到相关帖子':'你的第一篇花草手记'}</strong><p>记一次养护发现，分享一种相处方式。</p></div></div>`}<details class="account-info"><summary>友善交流，从花友公约开始</summary><p>请勿发布广告、交易信息或个人联系方式。养护经验不能证明植物无毒；不鼓励试吃、接触测试或自行用药。</p></details><p class="community-urgent">疑似误食或宠物不适，请及时联系兽医，勿等待回复。</p></div>`;document.querySelector('#forum-search').onsubmit=e=>{e.preventDefault();forumQuery=e.target.querySelector('input').value;shop()};document.querySelectorAll('[data-forum-category]').forEach(b=>b.onclick=()=>{forumCategory=b.dataset.forumCategory;shop()});document.querySelectorAll('[data-forum-id]').forEach(b=>b.onclick=()=>forumDetail(b.dataset.forumId));document.querySelectorAll('[data-guide-action]').forEach(b=>b.onclick=()=>{const g=Guides.find(x=>x.id===b.dataset.guideAction);if(g.page==='identify')go('identify');else openLibrary(g.query||'')});window.scrollTo(0,0)}
function forumCompose(){if(!browserSignedIn())return loginPage();renderTabs(null);app.innerHTML=`<button class="small" id="forum-cancel">‹ 返回互助广场（保留草稿）</button><h2>写下你的问题<br>或生活发现。</h2><form id="forum-compose"><label class="small" for="forum-kind">帖子分类</label><select id="forum-kind" class="forum-input">${Community.categories.map(c=>`<option ${c===forumDraft.category?'selected':''}>${c}</option>`).join('')}</select><label class="small" for="forum-title">标题</label><input id="forum-title" class="forum-input" maxlength="60" placeholder="标题：4 至 60 字" value="${esc(forumDraft.title)}"><label class="small" for="forum-content">正文</label><textarea id="forum-content" class="forum-text" maxlength="2000" placeholder="请描述植物名称、养护环境和具体问题；不要填写手机号、地址等个人信息。正文 10 至 2000 字。">${esc(forumDraft.content)}</textarea><div class="notice">仅保存到当前账号的本机空间。疑似误食或宠物不适，请立即联系兽医。</div><p id="forum-error" role="alert"></p><button class="btn primary" type="submit">保存帖子（仅本机）</button></form>`;const readDraft=()=>({title:document.querySelector('#forum-title').value,content:document.querySelector('#forum-content').value,category:document.querySelector('#forum-kind').value});document.querySelector('#forum-cancel').onclick=()=>{forumDraft=readDraft();shop()};document.querySelector('#forum-compose').onsubmit=e=>{e.preventDefault();forumDraft=readDraft();try{const post=Community.create(forumDraft,browserProfile());localStorage.setItem(browserKey('community'),JSON.stringify([post,...forumRecords()]));forumDraft={title:'',content:'',category:'养花求助'};forumDetail(post.id)}catch(err){document.querySelector('#forum-error').textContent=err.message||'保存失败，请重试'}};window.scrollTo(0,0)}
function forumDetail(id){if(!browserSignedIn())return loginPage();const p=forumRecords().find(p=>p.id===id);if(!p)return shop();renderTabs(null);app.innerHTML=`<button class="small" onclick="shop()">‹ 返回互助广场</button><div style="margin-top:25px"><span class="badge low">${p.category}</span></div><h2>${esc(p.title)}</h2><p>${esc(p.nickname)} · ${p.date} · 仅本机</p><div class="body forum-body">${esc(p.content)}</div><div class="notice">个人经验未经核实，不能替代毒性依据或兽医诊断。疑似误食不要等待回复。</div><div class="section">交流回复 · ${p.replies.length}</div>${p.replies.length?p.replies.map(r=>`<div class="card"><strong>${esc(r.nickname)}</strong><p>${r.date} · 仅本机</p><div class="body forum-body">${esc(r.content)}</div></div>`).join(''):'<p>还没有回复，真实的观察和友善的建议都很珍贵。</p>'}<form id="forum-reply"><label for="forum-reply-text" class="small">写下友善的回复</label><textarea id="forum-reply-text" class="forum-text reply-text" maxlength="1000" placeholder="5 至 1000 字"></textarea><p id="forum-error" role="alert"></p><button class="btn primary" type="submit">保存回复（仅本机）</button></form>`;document.querySelector('#forum-reply').onsubmit=e=>{e.preventDefault();try{const all=forumRecords(),current=all.find(p=>p.id===id);const updated=Community.reply(current,{content:document.querySelector('#forum-reply-text').value},browserProfile());localStorage.setItem(browserKey('community'),JSON.stringify(all.map(p=>p.id===id?updated:p)));forumDetail(id)}catch(err){document.querySelector('#forum-error').textContent=err.message||'保存失败，请重试'}};window.scrollTo(0,0)}
function renderTabs(active){let nav=document.querySelector('#bottom-tabs');if(!nav){nav=document.createElement('nav');nav.id='bottom-tabs';nav.className='bottom-tabs';nav.setAttribute('aria-label','主要导航');document.querySelector('.phone').appendChild(nav)}nav.hidden=!active;if(!active)return;const paths={home:'M4 11 12 4l8 7M6 10v10h12V10M10 20v-6h4v6',library:'M12 6C8 3 4 4 3 5v14c3-2 6-2 9 0 3-2 6-2 9 0V5c-3-2-6-2-9 1Zm0 0v13',shop:'M4 4h16v12H9l-5 4V4Zm4 5h8M8 12h5',account:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2'};nav.innerHTML=[['home','首页'],['library','植物图鉴'],['shop','花友互助'],['account','我的']].map(([key,label])=>`<button class="tab ${active===key?'is-active':''}" aria-current="${active===key?'page':'false'}" onclick="go('${key}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[key]}"/></svg><span>${label}</span></button>`).join('')}
home();
</script></html>
